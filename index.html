<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Blooket Game</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Import Map for ES Modules -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18",
          "react-dom": "https://esm.sh/react-dom@18",
          "react-dom/client": "https://esm.sh/react-dom@18/client",
          "react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
          "lucide-react": "https://esm.sh/lucide-react@^0.344.0"
        }
      }
    </script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from 'firebase/auth';
        import { getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, getDoc, serverTimestamp } from 'firebase/firestore';
        import { 
          Box, Coins, Gem, Store, Package, Gamepad2, Recycle, 
          Bolt, Trophy, CheckCircle2, AlertCircle, X, Sparkles, Shield, Flame, Zap, Mail, KeyRound, RefreshCw, ArrowRight, UserCheck, Repeat, Settings, User, Loader2, Disc, Globe, ShieldCheck, Volume2, VolumeX, Music, Wand2, Plus, Trash2, BookOpen, Swords, Users, LogOut, Edit3
        } from 'lucide-react';

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        const POKEMON_LIST = [
          { name: "Pikachu", id: 25, type: "Electric", rarity: "Common", hp: 95, attack: 35, evolvesTo: "Raichu", evolveCount: 3 },
          { name: "Raichu", id: 26, type: "Electric", rarity: "Uncommon", hp: 135, attack: 50 },
          { name: "Bulbasaur", id: 1, type: "Grass", rarity: "Common", hp: 110, attack: 30, evolvesTo: "Ivysaur", evolveCount: 3 },
          { name: "Ivysaur", id: 2, type: "Grass", rarity: "Uncommon", hp: 132, attack: 42, evolvesTo: "Venusaur", evolveCount: 5 },
          { name: "Venusaur", id: 3, type: "Grass", rarity: "Rare", hp: 165, attack: 55 },
          { name: "Squirtle", id: 7, type: "Water", rarity: "Common", hp: 102, attack: 32, evolvesTo: "Wartortle", evolveCount: 3 },
          { name: "Wartortle", id: 8, type: "Water", rarity: "Uncommon", hp: 128, attack: 44, evolvesTo: "Blastoise", evolveCount: 5 },
          { name: "Blastoise", id: 9, type: "Water", rarity: "Rare", hp: 158, attack: 54 },
          { name: "Charmander", id: 4, type: "Fire", rarity: "Common", hp: 98, attack: 38, evolvesTo: "Charmeleon", evolveCount: 3 },
          { name: "Charmeleon", id: 5, type: "Fire", rarity: "Uncommon", hp: 130, attack: 48, evolvesTo: "Charizard", evolveCount: 5 },
          { name: "Charizard", id: 6, type: "Fire", rarity: "Rare", hp: 162, attack: 62 },
          { name: "Jigglypuff", id: 39, type: "Fairy", rarity: "Uncommon", hp: 145, attack: 28 },
          { name: "Snorlax", id: 143, type: "Normal", rarity: "Uncommon", hp: 210, attack: 35 },
          { name: "Eevee", id: 133, type: "Normal", rarity: "Uncommon", hp: 105, attack: 34 },
          { name: "Gengar", id: 94, type: "Ghost", rarity: "Rare", hp: 140, attack: 58 },
          { name: "Lucario", id: 448, type: "Fighting", rarity: "Rare", hp: 148, attack: 62 },
          { name: "Rayquaza", id: 384, type: "Dragon", rarity: "Epic", hp: 185, attack: 145 },
          { name: "Mewtwo", id: 150, type: "Psychic", rarity: "Legendary", hp: 195, attack: 145 },
          { name: "Lugia", id: 249, type: "Psychic", rarity: "Legendary", hp: 205, attack: 135 },
          { name: "Mega Shiny Ampharos", id: 181, type: "Electric/Dragon", rarity: "Chroma", hp: 240, attack: 160 }, 
          { name: "Mega Shiny Rayquaza", id: 384, type: "Dragon/Flying", rarity: "Chroma", hp: 275, attack: 180 } 
        ];

        const BOX_CONFIG = {
          starter: { cost: 50, rarities: ['Common'], name: 'Starter Box', color: 'emerald' },
          master: { cost: 150, rarities: ['Uncommon', 'Rare'], name: 'Master Box', color: 'blue' },
          legendary: { cost: 400, rarities: ['Epic', 'Legendary', 'Chroma'], name: 'Legendary Box', color: 'amber' }
        };

        const WHEEL_PRIZES = [
          { label: "100 Coins", type: "coins", value: 100 },
          { label: "5 Gems", type: "gems", value: 5 },
          { label: "Starter Box", type: "box", value: "starter" },
          { label: "250 Coins", type: "coins", value: 250 },
          { label: "10 Gems", type: "gems", value: 10 },
          { label: "Master Box", type: "box", value: "master" },
          { label: "Legendary Box", type: "box", value: "legendary" }
        ];

        const DEFAULT_TRIVIA = {
          math: {
            name: "Mathematics",
            color: "from-blue-600 to-indigo-600",
            questions: [
              { question: "What is 7 x 8?", options: ["54", "56", "64", "48"], correct: [1] },
              { question: "What is square root of 144?", options: ["10", "11", "12", "14"], correct: [2] },
              { question: "What is 15% of 200?", options: ["20", "25", "30", "35"], correct: [2] },
              { question: "Solve for x: 3x + 5 = 20", options: ["3", "5", "7", "10"], correct: [1] },
              { question: "What is 9 squared (9²)?", options: ["72", "81", "90", "99"], correct: [1] }
            ]
          },
          science: {
            name: "Science",
            color: "from-emerald-600 to-teal-600",
            questions: [
              { question: "Chemical symbol for Gold?", options: ["Ag", "Fe", "Au", "Cu"], correct: [2] },
              { question: "Red Planet?", options: ["Venus", "Mars", "Jupiter", "Saturn"], correct: [1] },
              { question: "Powerhouse of the cell?", options: ["Nucleus", "Mitochondria", "Ribosome", "Golgi"], correct: [1] },
              { question: "Gas absorbed by plants?", options: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], correct: [2] }
            ]
          },
          pokemon: {
            name: "Pokémon Trivia",
            color: "from-purple-600 to-pink-600",
            questions: [
              { question: "Pikachu evolves with what stone?", options: ["Fire", "Thunder", "Water", "Leaf"], correct: [1] },
              { question: "Effective against Water?", options: ["Fire", "Electric", "Ground", "Normal"], correct: [1] },
              { question: "Flame Pokémon with burning tail?", options: ["Bulbasaur", "Squirtle", "Charmander", "Pikachu"], correct: [2] }
            ]
          }
        };

        export default function App() {
          const [user, setUser] = useState(null);
          const [isMusic, setIsMusic] = useState(false);
          const audioRef = useRef(null);

          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [isGuest, setIsGuest] = useState(false);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [isReg, setIsReg] = useState(false);

          const [username, setUsername] = useState('Trainer');
          const [isUserModal, setIsUserModal] = useState(false);
          const [newUsername, setNewUsername] = useState('');

          const [coins, setCoins] = useState(500);
          const [gems, setGems] = useState(50);
          const [inventory, setInventory] = useState([
            { id: 25, name: "Pikachu", type: "Electric", rarity: "Common", count: 3, hp: 95, maxHp: 95, attack: 35, evolvesTo: "Raichu", evolveCount: 3 }
          ]);
          const [activeTab, setActiveTab] = useState('shop');
          const [notif, setNotif] = useState(null);

          const [isOpeningBox, setIsOpeningBox] = useState(false);
          const [boxReward, setBoxReward] = useState(null);
          const [isBoxModal, setIsBoxModal] = useState(false);

          const [isSpinning, setIsSpinning] = useState(false);
          const [spinResult, setSpinResult] = useState(null);
          const [wheelRot, setWheelRot] = useState(0);
          const [canSpin, setCanSpin] = useState(true);

          const [triviaSubjects, setTriviaSubjects] = useState(DEFAULT_TRIVIA);
          const [isCreatingSet, setIsCreatingSet] = useState(false);
          const [setName, setSetName] = useState('');
          const [setQuestions, setSetQuestions] = useState([{ question: '', options: ['', '', '', ''], correct: [0] }]);

          const [selectedUserPokemon, setSelectedUserPokemon] = useState(inventory[0]);
          const [userHp, setUserHp] = useState(95);
          const [selectedSubject, setSelectedSubject] = useState('math');
          const [usedQs, setUsedQs] = useState([]);
          
          const [wildPokemon, setWildPokemon] = useState({ name: "Wild Charizard", id: 6, hp: 120, maxHp: 120, attack: 35 });
          const [currentQ, setCurrentQ] = useState(null);
          const [selectedAnswers, setSelectedAnswers] = useState([]);
          const [isAnswering, setIsAnswering] = useState(false);
          const [battleLog, setBattleLog] = useState("Answer trivia correctly to attack the wild Pokémon!");
          const [isVictory, setIsVictory] = useState(false);
          const [isDefeat, setIsDefeat] = useState(false);

          const [trades, setTrades] = useState([]);
          const [pvpLobbies, setPvpLobbies] = useState([]);
          const [activePvp, setActivePvp] = useState(null);
          const [joinId, setJoinId] = useState('');

          useEffect(() => {
            if (audioRef.current) {
              if (isMusic) audioRef.current.play().catch(() => setIsMusic(false));
              else audioRef.current.pause();
            }
          }, [isMusic]);

          useEffect(() => {
            const init = async () => {
              try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              } catch (e) {}
            };
            init();
            return onAuthStateChanged(auth, u => u && setUser(u));
          }, []);

          useEffect(() => {
            if (!user || isGuest || user.isAnonymous) return;
            getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid)).then(snap => {
              if (snap.exists()) {
                const d = snap.data();
                if (d.coins !== undefined) setCoins(d.coins);
                if (d.gems !== undefined) setGems(d.gems);
                if (d.inventory) {
                  setInventory(d.inventory);
                  if (d.inventory[0]) setSelectedUserPokemon(d.inventory[0]);
                }
                if (d.triviaSubjects) setTriviaSubjects(d.triviaSubjects);
                if (d.username) setUsername(d.username);
              }
            }).catch(() => {});
          }, [user, isGuest]);

          const saveCloud = async (c, g, inv, subj, name) => {
            if (!user || isGuest || user.isAnonymous) return;
            try {
              await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
                username: name !== undefined ? name : username,
                coins: c !== undefined ? c : coins,
                gems: g !== undefined ? g : gems,
                inventory: inv !== undefined ? inv : inventory,
                triviaSubjects: subj !== undefined ? subj : triviaSubjects,
                updatedAt: serverTimestamp()
              }, { merge: true });
            } catch (e) {}
          };

          useEffect(() => {
            if (!user) return;
            const unsubTrades = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'trade_offers'), snap => {
              const arr = [];
              snap.forEach(s => arr.push({ id: s.id, ...s.data() }));
              setTrades(arr);
            }, () => {});

            const unsubPvp = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'pvp_lobbies'), snap => {
              const arr = [];
              snap.forEach(s => arr.push({ id: s.id, ...s.data() }));
              setPvpLobbies(arr);
            }, () => {});

            return () => { unsubTrades(); unsubPvp(); };
          }, [user]);

          const notify = (msg, type = 'success') => {
            setNotif({ message: msg, type });
            setTimeout(() => setNotif(null), 3000);
          };

          const handleAuth = async (e) => {
            e.preventDefault();
            if (!email || !password) return notify("Enter email and password.", "error");
            try {
              if (isReg) await createUserWithEmailAndPassword(auth, email, password);
              else await signInWithEmailAndPassword(auth, email, password);
              setIsGuest(false);
              setIsLoggedIn(true);
              setUsername(email.split('@')[0]);
              notify("Logged in successfully!");
            } catch (err) {
              if (err.code === 'auth/operation-not-allowed') {
                setIsGuest(true);
                setIsLoggedIn(true);
                setUsername(email.split('@')[0] || 'Trainer');
                notify("Logged in locally!");
              } else {
                notify(err.message, "error");
              }
            }
          };

          const buyBox = (key) => {
            const box = BOX_CONFIG[key];
            if (coins < box.cost) return notify("Not enough coins!", "error");
            const newCoins = coins - box.cost;
            setCoins(newCoins);
            setIsBoxModal(true);
            setIsOpeningBox(true);
            setBoxReward(null);

            setTimeout(() => {
              const possible = POKEMON_LIST.filter(p => box.rarities.includes(p.rarity));
              const won = possible[Math.floor(Math.random() * possible.length)];
              setInventory(prev => {
                const idx = prev.findIndex(p => p.name === won.name);
                let updated = [...prev];
                if (idx > -1) updated[idx].count += 1;
                else updated.push({ ...won, count: 1, maxHp: won.hp });
                saveCloud(newCoins, undefined, updated, undefined);
                return updated;
              });
              setBoxReward(won);
              setIsOpeningBox(false);
              notify(`Unlocked ${won.name}!`);
            }, 1500);
          };

          const spinWheel = () => {
            if (isSpinning || !canSpin) return;
            setIsSpinning(true);
            setSpinResult(null);
            const winIdx = Math.floor(Math.random() * WHEEL_PRIZES.length);
            const target = wheelRot + 1800 + (winIdx * (360 / WHEEL_PRIZES.length));
            setWheelRot(target);

            setTimeout(() => {
              setIsSpinning(false);
              const prize = WHEEL_PRIZES[winIdx];
              setSpinResult(prize);
              setCanSpin(false);
              if (prize.type === 'coins') {
                const nc = coins + prize.value;
                setCoins(nc);
                saveCloud(nc, undefined, undefined, undefined);
              } else if (prize.type === 'gems') {
                const ng = gems + prize.value;
                setGems(ng);
                saveCloud(undefined, ng, undefined, undefined);
              } else {
                buyBox(prize.value);
              }
              notify(`Won ${prize.label}!`);
            }, 3000);
          };

          const createPvpLobby = async () => {
            const fighter = selectedUserPokemon || inventory[0];
            try {
              const ref = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pvp_lobbies'), {
                host: username,
                hostPokemon: fighter.name,
                hostHp: fighter.hp || 95,
                hostMaxHp: fighter.hp || 95,
                status: 'waiting',
                timestamp: serverTimestamp()
              });
              setActivePvp({ id: ref.id, role: 'host', host: username, hostPokemon: fighter.name, hostHp: fighter.hp || 95, hostMaxHp: fighter.hp || 95, status: 'waiting' });
              notify(`Created PvP Lobby! ID: ${ref.id}`);
            } catch (e) {
              notify("Failed to create lobby", "error");
            }
          };

          const joinPvpLobby = async (lobby) => {
            const fighter = selectedUserPokemon || inventory[0];
            try {
              await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pvp_lobbies', lobby.id), {
                guest: username,
                guestPokemon: fighter.name,
                guestHp: fighter.hp || 95,
                guestMaxHp: fighter.hp || 95,
                status: 'active',
                turn: lobby.host
              });
              setActivePvp({ ...lobby, guest: username, guestPokemon: fighter.name, guestHp: fighter.hp || 95, guestMaxHp: fighter.hp || 95, status: 'active', turn: lobby.host, role: 'guest' });
              notify("Joined PvP battle!");
            } catch (e) {
              notify("Failed to join lobby", "error");
            }
          };

          const handleJoinById = async () => {
            const id = joinId.trim();
            if (!id) return notify("Enter a valid Match ID.", "error");

            const found = pvpLobbies.find(l => l.id === id || l.id.includes(id));
            if (found) {
              if (found.status !== 'waiting') return notify("Match already started or full!", "error");
              await joinPvpLobby(found);
              return;
            }

            try {
              const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pvp_lobbies', id));
              if (snap.exists()) {
                const data = snap.data();
                if (data.status !== 'waiting') return notify("Match already started or full!", "error");
                await joinPvpLobby({ id: snap.id, ...data });
                return;
              }
            } catch (e) {}

            notify("Match lobby not found!", "error");
          };

          return (
            <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans select-none">
              <audio ref={audioRef} loop src="https://vgmsite.com/soundtracks/pokemon-game-boy-sound-collection/yxfhszjjtw/101-opening.mp3" />

              {notif && (
                <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 border ${notif.type === 'error' ? 'bg-red-950/95 border-red-500 text-red-200' : 'bg-emerald-950/95 border-emerald-500 text-emerald-200'}`}>
                  {notif.type === 'error' ? <AlertCircle className="w-5 h-5 text-red-400" /> : <CheckCircle2 className="w-5 h-5 text-emerald-400" />}
                  <span className="font-medium text-sm">{notif.message}</span>
                </div>
              )}

              {!isLoggedIn ? (
                <div className="flex-1 flex items-center justify-center p-6 bg-gradient-to-br from-indigo-950 via-slate-900 to-purple-950">
                  <div className="w-full max-w-md bg-slate-800/90 border border-slate-700 p-8 rounded-3xl shadow-2xl space-y-6">
                    <div className="text-center space-y-2">
                      <div className="w-16 h-16 bg-red-600 rounded-full mx-auto flex items-center justify-center shadow-lg border-4 border-white">
                        <div className="w-6 h-6 bg-slate-900 rounded-full border-2 border-white"></div>
                      </div>
                      <h1 className="text-3xl font-extrabold tracking-wider bg-gradient-to-r from-red-400 to-yellow-400 bg-clip-text text-transparent">Pokémon Blooket</h1>
                      <p className="text-slate-400 text-sm">{isReg ? 'Create Trainer Account' : 'Login to Cloud'}</p>
                    </div>
                    <form onSubmit={handleAuth} className="space-y-4">
                      <div>
                        <label className="text-xs font-semibold text-slate-400">Email</label>
                        <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="ash@pallet.town" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none focus:border-red-500" />
                      </div>
                      <div>
                        <label className="text-xs font-semibold text-slate-400">Password</label>
                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm mt-1 focus:outline-none focus:border-red-500" />
                      </div>
                      <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-red-600 to-orange-600 font-bold rounded-xl shadow-lg transition-all">{isReg ? 'Register' : 'Login'}</button>
                      <div className="flex justify-between text-xs text-slate-400 pt-2">
                        <button type="button" onClick={() => setIsReg(!isReg)} className="text-red-400 hover:underline">{isReg ? 'Have account? Login' : 'Need account? Register'}</button>
                        <button type="button" onClick={() => { setIsGuest(true); setIsLoggedIn(true); }} className="hover:underline">Play as Guest</button>
                      </div>
                    </form>
                  </div>
                </div>
              ) : (
                <>
                  <header className="bg-slate-800/90 border-b border-slate-700 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-40 backdrop-blur-md">
                    <div className="flex items-center gap-3">
                      <div className="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center border-2 border-white">
                        <div className="w-4 h-4 bg-slate-900 rounded-full border border-white"></div>
                      </div>
                      <div>
                        <h1 className="text-lg font-black bg-gradient-to-r from-red-400 to-amber-400 bg-clip-text text-transparent">Pokémon Blooket</h1>
                        <div className="flex items-center gap-2 text-xs text-slate-400">
                          <UserCheck className="w-3.5 h-3.5 text-emerald-400" />
                          <span>Trainer: <strong className="text-slate-200">{username}</strong></span>
                          <button onClick={() => { setNewUsername(username); setIsUserModal(true); }}><Edit3 className="w-3.5 h-3.5" /></button>
                          <button onClick={() => { setIsLoggedIn(false); setUser(null); }} className="ml-2 px-2.5 py-0.5 bg-red-600/80 rounded text-white flex items-center gap-1"><LogOut className="w-3 h-3" />Logout</button>
                        </div>
                      </div>
                    </div>

                    <div className="flex items-center gap-4">
                      <div className="flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                        <Coins className="w-4 h-4 text-amber-400" />
                        <span className="font-bold text-amber-300">{coins}</span>
                      </div>
                      <div className="flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-700">
                        <Gem className="w-4 h-4 text-cyan-400" />
                        <span className="font-bold text-cyan-300">{gems}</span>
                      </div>
                      <button onClick={() => setIsMusic(!isMusic)} className={`p-2 rounded-xl border ${isMusic ? 'bg-amber-600/20 border-amber-500 text-amber-400' : 'bg-slate-900 border-slate-700 text-slate-400'}`}>
                        {isMusic ? <Volume2 className="w-4 h-4" /> : <VolumeX className="w-4 h-4" />}
                      </button>
                    </div>
                  </header>

                  <nav className="bg-slate-800/60 border-b border-slate-700 px-6 py-2 flex gap-2 overflow-x-auto">
                    {[
                      { id: 'shop', label: 'Shop', icon: Store },
                      { id: 'inventory', label: 'Collection', icon: Package },
                      { id: 'battle', label: 'Battle', icon: Gamepad2 },
                      { id: 'sets', label: 'Sets', icon: BookOpen },
                      { id: 'wheel', label: 'Wheel', icon: Disc },
                      { id: 'trade', label: 'Trade', icon: Repeat },
                      { id: 'pvp', label: 'PvP', icon: Users }
                    ].map(tab => {
                      const Icon = tab.icon;
                      return (
                        <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 px-4 py-2 rounded-xl font-bold text-sm whitespace-nowrap ${activeTab === tab.id ? 'bg-red-600 text-white shadow-lg' : 'text-slate-400 hover:text-slate-200'}`}>
                          <Icon className="w-4 h-4" />{tab.label}
                        </button>
                      );
                    })}
                  </nav>

                  <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
                    {activeTab === 'shop' && (
                      <div className="space-y-6">
                        <h2 className="text-2xl font-black text-center">Mystery Box Shop</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                          {Object.entries(BOX_CONFIG).map(([key, box]) => (
                            <div key={key} className="bg-slate-800 border border-slate-700 p-6 rounded-3xl flex flex-col justify-between shadow-xl">
                              <div className="text-center space-y-3">
                                <div className="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-red-600 to-amber-600 flex items-center justify-center shadow">
                                  <Box className="w-8 h-8 text-white" />
                                </div>
                                <h3 className="text-lg font-bold">{box.name}</h3>
                                <p className="text-xs text-slate-400">Rarity: {box.rarities.join(', ')}</p>
                              </div>
                              <div className="mt-6 pt-4 border-t border-slate-700 flex justify-between items-center">
                                <span className="font-bold text-amber-300 flex items-center gap-1"><Coins className="w-4 h-4" />{box.cost}</span>
                                <button onClick={() => buyBox(key)} className="px-4 py-2 bg-red-600 hover:bg-red-500 font-bold text-sm rounded-xl">Open</button>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {activeTab === 'inventory' && (
                      <div className="space-y-6">
                        <h2 className="text-2xl font-black">My Pokémon Collection</h2>
                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                          {inventory.map((p, i) => (
                            <div key={i} className="bg-slate-800 border border-slate-700 p-5 rounded-3xl space-y-3 relative">
                              <div className="absolute top-4 right-4 bg-slate-900 px-2.5 py-0.5 rounded-full text-xs font-black text-amber-400">x{p.count}</div>
                              <div className="flex items-center gap-3">
                                <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id || 25}.png`} alt={p.name} className="w-12 h-12 object-contain" />
                                <div>
                                  <h3 className="font-bold">{p.name}</h3>
                                  <span className="text-xs px-2 py-0.5 bg-slate-700 rounded-full">{p.type}</span>
                                </div>
                              </div>
                              <div className="text-xs text-slate-400 flex justify-between pt-2 border-t border-slate-700">
                                <span>HP: {p.hp}</span><span>Atk: {p.attack}</span>
                              </div>
                              <button onClick={() => {
                                const inv = [...inventory];
                                if (inv[i].count > 1) inv[i].count -= 1;
                                else inv.splice(i, 1);
                                setCoins(c => c + 25);
                                setInventory(inv);
                                saveCloud(coins + 25, undefined, inv, undefined);
                                notify("Sold duplicate for 25 coins!");
                              }} className="w-full py-2 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-xl">Sell Duplicate (+25c)</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {activeTab === 'battle' && (
                      <div className="space-y-6 max-w-3xl mx-auto">
                        <h2 className="text-2xl font-black text-center">Battle Arena</h2>
                        <div className="bg-slate-800 border border-slate-700 p-8 rounded-3xl space-y-6 text-center">
                          <div className="flex justify-around items-center">
                            <div>
                              <h4 className="font-bold">{selectedUserPokemon.name}</h4>
                              <p className="text-xs text-emerald-400">HP: {userHp} / {selectedUserPokemon.hp}</p>
                            </div>
                            <span className="font-bold text-xl text-slate-500">VS</span>
                            <div>
                              <h4 className="font-bold">{wildPokemon.name}</h4>
                              <p className="text-xs text-red-400">HP: {wildPokemon.hp} / {wildPokemon.maxHp}</p>
                            </div>
                          </div>

                          <p className="text-sm bg-slate-900 p-4 rounded-xl border border-slate-700">{battleLog}</p>

                          {isVictory || isDefeat ? (
                            <button onClick={() => {
                              setWildPokemon({ name: "Wild Opponent", id: 6, hp: 120, maxHp: 120, attack: 35 });
                              setUserHp(selectedUserPokemon.hp);
                              setIsVictory(false);
                              setIsDefeat(false);
                              setBattleLog("New battle started!");
                            }} className="px-6 py-3 bg-emerald-600 font-bold rounded-xl">New Battle</button>
                          ) : !isAnswering ? (
                            <button onClick={() => {
                              const qList = triviaSubjects[selectedSubject].questions;
                              const q = qList[Math.floor(Math.random() * qList.length)];
                              setCurrentQ(q);
                              setSelectedAnswers([]);
                              setIsAnswering(true);
                            }} className="px-8 py-3 bg-red-600 font-bold rounded-xl">Attack / Answer Trivia</button>
                          ) : (
                            <div className="space-y-4 text-left">
                              <h4 className="font-bold text-center">{currentQ?.question}</h4>
                              <div className="grid grid-cols-2 gap-3">
                                {currentQ?.options.map((opt, i) => {
                                  const sel = selectedAnswers.includes(i);
                                  return (
                                    <button key={i} onClick={() => setSelectedAnswers(sel ? selectedAnswers.filter(x => x !== i) : [...selectedAnswers, i])} className={`p-3 rounded-xl border text-xs font-bold ${sel ? 'bg-indigo-600 border-indigo-400' : 'bg-slate-900 border-slate-700'}`}>
                                      {opt}
                                    </button>
                                  );
                                })}
                              </div>
                              <button onClick={() => {
                                const correct = selectedAnswers.length === 1 && currentQ.correct.includes(selectedAnswers[0]);
                                setIsAnswering(false);
                                if (correct) {
                                  const newHp = Math.max(0, wildPokemon.hp - selectedUserPokemon.attack);
                                  setWildPokemon(p => ({ ...p, hp: newHp }));
                                  if (newHp === 0) {
                                    setIsVictory(true);
                                    setCoins(c => c + 100);
                                    saveCloud(coins + 100, undefined, undefined, undefined);
                                    notify("Victory! Won 100 coins!");
                                  } else {
                                    setBattleLog("Correct attack!");
                                  }
                                } else {
                                  const newHp = Math.max(0, userHp - wildPokemon.attack);
                                  setUserHp(newHp);
                                  if (newHp === 0) {
                                    setIsDefeat(true);
                                    notify("Defeat!", "error");
                                  } else {
                                    setBattleLog("Incorrect! Opponent counterattacked.");
                                  }
                                }
                              }} className="w-full py-3 bg-emerald-600 font-bold rounded-xl">Submit Answer</button>
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {activeTab === 'wheel' && (
                      <div className="space-y-6 max-w-md mx-auto text-center">
                        <h2 className="text-2xl font-black">Daily Prize Wheel</h2>
                        <div className="bg-slate-800 border border-slate-700 p-8 rounded-3xl space-y-6 flex flex-col items-center">
                          <div className="w-48 h-48 rounded-full border-8 border-slate-700 flex items-center justify-center relative overflow-hidden">
                            <div className="w-full h-full absolute transition-transform duration-[3000ms]" style={{ transform: `rotate(${wheelRot}deg)`, background: 'conic-gradient(#ef4444 0deg 120deg, #f59e0b 120deg 240deg, #10b981 240deg 360deg)' }}></div>
                            <div className="w-10 h-10 bg-slate-900 rounded-full border-2 border-white z-10 flex items-center justify-center"><Sparkles className="w-4 h-4 text-amber-400" /></div>
                          </div>
                          <button onClick={spinWheel} disabled={isSpinning || !canSpin} className={`px-8 py-3 font-bold rounded-xl ${canSpin && !isSpinning ? 'bg-red-600' : 'bg-slate-700 cursor-not-allowed'}`}>
                            {isSpinning ? 'Spinning...' : canSpin ? 'Spin!' : 'Come back tomorrow'}
                          </button>
                          {spinResult && <p className="text-emerald-300 font-bold text-sm">Won {spinResult.label}!</p>}
                        </div>
                      </div>
                    )}

                    {activeTab === 'trade' && (
                      <div className="space-y-6 max-w-2xl mx-auto">
                        <div className="flex justify-between items-center">
                          <h2 className="text-2xl font-black">Trading Marketplace</h2>
                          <button onClick={async () => {
                            const off = prompt("Your Pokémon to offer:");
                            const ask = prompt("Pokémon you want:");
                            if (!off || !ask) return;
                            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'trade_offers'), { trainer: username, offeredPokemon: off, askingPokemon: ask, timestamp: serverTimestamp() });
                            notify("Trade posted!");
                          }} className="px-4 py-2 bg-red-600 font-bold text-sm rounded-xl">Create Offer</button>
                        </div>
                        <div className="space-y-4">
                          {trades.length === 0 ? <p className="text-center text-slate-400">No trade offers active.</p> : trades.map(t => (
                            <div key={t.id} className="bg-slate-800 border border-slate-700 p-4 rounded-2xl flex justify-between items-center">
                              <div>
                                <p className="text-xs text-slate-400">Trainer: {t.trainer}</p>
                                <p className="font-bold text-sm">{t.offeredPokemon} ➡️️ {t.askingPokemon}</p>
                              </div>
                              <button onClick={async () => {
                                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'trade_offers', t.id));
                                notify("Trade completed!");
                              }} className="px-3 py-1.5 bg-emerald-600 text-xs font-bold rounded-lg">Accept</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {activeTab === 'pvp' && (
                      <div className="space-y-6 max-w-2xl mx-auto">
                        <h2 className="text-2xl font-black">Online PvP Arena</h2>
                        {!activePvp ? (
                          <div className="space-y-4">
                            <div className="bg-slate-800 border border-slate-700 p-6 rounded-3xl flex justify-between items-center">
                              <select value={selectedUserPokemon?.name} onChange={e => setSelectedUserPokemon(inventory.find(p => p.name === e.target.value))} className="bg-slate-900 border border-slate-700 text-sm rounded-xl px-3 py-2">
                                {inventory.map((p, i) => <option key={i} value={p.name}>{p.name}</option>)}
                              </select>
                              <button onClick={createPvpLobby} className="px-6 py-2.5 bg-red-600 font-bold text-sm rounded-xl">Host PvP Lobby</button>
                            </div>
                            <div className="bg-slate-800 border border-slate-700 p-6 rounded-3xl flex gap-3">
                              <input type="text" value={joinId} onChange={e => setJoinId(e.target.value)} placeholder="Enter Match ID..." className="flex-1 bg-slate-900 border border-slate-700 px-4 py-2 text-sm rounded-xl" />
                              <button onClick={handleJoinById} className="px-6 py-2.5 bg-indigo-600 font-bold text-sm rounded-xl">Join Match</button>
                            </div>
                          </div>
                        ) : (
                          <div className="bg-slate-800 border border-slate-700 p-6 rounded-3xl text-center space-y-4">
                            <h3 className="font-bold">Match ID: {activePvp.id}</h3>
                            <p className="text-xs text-amber-400">Status: {activePvp.status}</p>
                            <button onClick={() => setActivePvp(null)} className="px-4 py-2 bg-red-600 text-xs font-bold rounded-xl">Leave Match</button>
                          </div>
                        )}
                      </div>
                    )}
                  </main>
                </>
              )}

              {isUserModal && (
                <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-3xl max-w-sm w-full space-y-4">
                    <h3 className="font-bold">Change Username</h3>
                    <input type="text" value={newUsername} onChange={e => setNewUsername(e.target.value)} className="w-full bg-slate-900 border border-slate-700 px-3 py-2 text-sm rounded-xl" />
                    <div className="flex gap-2">
                      <button onClick={() => setIsUserModal(false)} className="flex-1 py-2 bg-slate-700 rounded-xl text-xs font-bold">Cancel</button>
                      <button onClick={() => { setUsername(newUsername); saveCloud(undefined, undefined, undefined, undefined, newUsername); setIsUserModal(false); notify("Username updated!"); }} className="flex-1 py-2 bg-red-600 rounded-xl text-xs font-bold">Save</button>
                    </div>
                  </div>
                </div>
              )}

              {isBoxModal && (
                <div className="fixed inset-0 bg-slate-950/80 flex items-center justify-center p-4 z-50">
                  <div className="bg-slate-800 border border-slate-700 p-6 rounded-3xl max-w-sm w-full text-center space-y-4">
                    <h3 className="font-bold">{isOpeningBox ? 'Opening...' : 'Unlocked!'}</h3>
                    {isOpeningBox ? <Loader2 className="w-8 h-8 animate-spin mx-auto text-red-500" /> : boxReward && (
                      <div className="space-y-2">
                        <img src={`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${boxReward.id}.png`} alt={boxReward.name} className="w-20 h-20 mx-auto object-contain" />
                        <p className="font-bold">{boxReward.name}</p>
                        <button onClick={() => setIsBoxModal(false)} className="w-full py-2 bg-red-600 text-xs font-bold rounded-xl">Awesome!</button>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
